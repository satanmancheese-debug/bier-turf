<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Pilsch Turf</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&display=swap" rel="stylesheet">
</head>
<body>
    <h1>Pilsch Turf</h1>
    <div class="layout">
        <div class="grid-wrapper">
            <div class="grid">
                {% for name in housemates %}
                <button class="beer-btn" data-name="{{ name }}" onclick="addBeer('{{ name }}')">
                    <span class="badge-slot">
                        <span class="crown-badge" id="crown-{{ name }}">
                            <svg class="badge-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M3 18h18l-1.5-9-4.5 4-3-6-3 6-4.5-4L3 18z" fill="currentColor"/>
                            </svg>
                            <span class="badge-title">Mooie Pilschbaas</span>
                        </span>
                        <span class="jester-badge" id="jester-{{ name }}">
                            <svg class="badge-icon jester-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path d="M4 19c1-5 1-9-1-12 3 1 4.5 3 5 5 1-3 2-5 4-6 0 2.5 0.5 4.5 2 6 1.5-1.5 2-3.5 2-6 2 1 3 3 4 6 0.5-2 2-4 5-5-2 3-2 7-1 12z" fill="currentColor"/>
                                <circle cx="4" cy="19" r="1.4" fill="currentColor"/>
                                <circle cx="14" cy="12.5" r="1.4" fill="currentColor"/>
                                <circle cx="20" cy="19" r="1.4" fill="currentColor"/>
                            </svg>
                            <span class="badge-title jester-title">B-lid</span>
                        </span>
                    </span>
                    <span class="name">{{ name }}</span>
                    <span class="count" id="count-{{ name }}">{{ counts[name] }}</span>
                </button>
                {% endfor %}
            </div>

            <div class="out-of-stock-overlay" id="out-of-stock-overlay">
                <div class="out-of-stock-message">Contacteer de Beheerder</div>
            </div>
        </div>

        <div class="side-panel">
            <h2>Voorraad</h2>
            <div class="stat">
                <span class="stat-label">Beschikbaar</span>
                <span class="stat-value" id="stat-available">{{ stock.available }}</span>
            </div>
            <div class="stat">
                <span class="stat-label">Gedronken</span>
                <span class="stat-value" id="stat-drunk">{{ stock.drunk }}</span>
            </div>
            <div class="stat">
                <span class="stat-label">Tempo (24u)</span>
                <span class="stat-value" id="stat-pace">{{ stock.pace_24h }}</span>
            </div>
            <button class="restock-btn" onclick="restock()">Nieuwe voorraad</button>
        </div>
    </div>
    <div class="status" id="status">All synced</div>

    <div class="screensaver" id="screensaver">
        <div class="screensaver-frame">
            <div class="screensaver-title">Du Pont Pilsch Solutions</div>
        </div>
    </div>

        <script src="/static/script.js"></script>
</body>
</html>
